<!doctype html>
<html lang="ca" data-theme="fanzine">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="theme-color" content="#8a3b12" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/icons/icon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<script>try { var t = localStorage.getItem('mpp-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
